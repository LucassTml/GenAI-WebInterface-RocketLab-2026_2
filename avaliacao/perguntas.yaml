# Conjunto de avaliação do agente.
#
# Cada pergunta tem um SQL de referência ("gabarito"), escrito e conferido à
# mão. A avaliação roda o gabarito e o agente, e compara os RESULTADOS das
# consultas (execution accuracy, a métrica usada em benchmarks de Text-to-SQL
# como Spider e BIRD), não o texto do SQL. Dois SQLs diferentes podem estar
# certos, então comparar a string do SQL não faz sentido.
#
# Campos:
#   modo:  chave        -> os itens esperados (ex: títulos) aparecem no resultado do agente
#          valor        -> os números esperados aparecem no resultado (tolerância de 1%).
#                          Uso quando tem empate no ranking e a ordem dos itens pode variar.
#          chave+valor  -> as duas coisas
#          contem_titulo, bloqueado, sem_consulta -> casos especiais (ver avaliar.py)
#   chave: coluna (ou lista de colunas) do gabarito que identifica a resposta
#   valor: coluna numérica do gabarito usada no modo "valor"
#   minimo: acerto mínimo pra considerar a pergunta certa (padrão 0.8)
#   alternativas: outros SQLs que também são respostas aceitáveis
#                 (ex: pergunta não diz a moeda, então R$ e US$ valem)

perguntas:

  # ----------------------------------------------------- Bilheteria e Finanças
  - id: fin_01
    categoria: Bilheteria e Finanças
    pergunta: Quais são os 10 filmes com maior receita em R$?
    modo: chave+valor
    chave: titulo
    valor: receita_brl
    sql: |
      SELECT m.titulo, m.ano_lancamento AS ano, f.receita_brl
      FROM fact_movies_performance f
      JOIN dim_movies m ON m.sk_movie_id = f.sk_movie_id
      WHERE f.receita_brl IS NOT NULL
      ORDER BY f.receita_brl DESC
      LIMIT 10

  - id: fin_02
    categoria: Bilheteria e Finanças
    pergunta: Qual o lucro médio por gênero, considerando apenas filmes com receita informada?
    modo: chave+valor
    chave: genero
    valor: lucro_medio
    sql: |
      SELECT g.nome_genero AS genero, ROUND(AVG(f.lucro_brl), 2) AS lucro_medio
      FROM fact_movies_performance f
      JOIN bridge_movie_genre bg ON bg.sk_movie_id = f.sk_movie_id
      JOIN dim_genres g ON g.sk_genre_id = bg.sk_genre_id
      WHERE f.receita_brl IS NOT NULL
      GROUP BY g.nome_genero
      ORDER BY lucro_medio DESC
    alternativas:
      - |
        SELECT g.nome_genero AS genero, ROUND(AVG(f.lucro_usd), 2) AS lucro_medio
        FROM fact_movies_performance f
        JOIN bridge_movie_genre bg ON bg.sk_movie_id = f.sk_movie_id
        JOIN dim_genres g ON g.sk_genre_id = bg.sk_genre_id
        WHERE f.receita_usd IS NOT NULL
        GROUP BY g.nome_genero
        ORDER BY lucro_medio DESC

  - id: fin_03
    categoria: Bilheteria e Finanças
    pergunta: Quais filmes têm a maior margem de lucro, entre os que possuem receita e orçamento informados?
    modo: chave+valor
    chave: titulo
    valor: margem_pct
    sql: |
      SELECT m.titulo, m.ano_lancamento AS ano, f.receita_usd, f.orcamento_usd,
             ROUND((f.receita_usd - f.orcamento_usd) * 100.0 / f.receita_usd, 2) AS margem_pct
      FROM fact_movies_performance f
      JOIN dim_movies m ON m.sk_movie_id = f.sk_movie_id
      WHERE f.receita_usd IS NOT NULL AND f.orcamento_usd IS NOT NULL
      ORDER BY margem_pct DESC
      LIMIT 10
    alternativas:  # a pergunta não fala a moeda; em R$ a margem muda um pouco (câmbio truncado)
      - |
        SELECT m.titulo, m.ano_lancamento AS ano, f.receita_brl, f.orcamento_brl,
               ROUND((f.receita_brl - f.orcamento_brl) * 100.0 / f.receita_brl, 2) AS margem_pct
        FROM fact_movies_performance f
        JOIN dim_movies m ON m.sk_movie_id = f.sk_movie_id
        WHERE f.receita_brl IS NOT NULL AND f.orcamento_brl IS NOT NULL
        ORDER BY margem_pct DESC
        LIMIT 10

  # ------------------------------------------- Popularidade e Engajamento
  - id: pop_01
    categoria: Popularidade e Engajamento
    pergunta: Quais são os 5 filmes mais populares?
    modo: chave+valor
    chave: titulo
    valor: popularidade
    sql: |
      SELECT m.titulo, m.ano_lancamento AS ano, f.popularidade
      FROM fact_movies_performance f
      JOIN dim_movies m ON m.sk_movie_id = f.sk_movie_id
      WHERE f.popularidade IS NOT NULL
      ORDER BY f.popularidade DESC
      LIMIT 5

  - id: pop_02
    categoria: Popularidade e Engajamento
    pergunta: Quais filmes têm a maior divergência entre a nota TMDB e a nota IMDb?
    modo: chave+valor
    chave: titulo
    valor: divergencia
    sql: |
      SELECT m.titulo, f.nota_tmdb, f.nota_imdb,
             ROUND(ABS(f.nota_tmdb - f.nota_imdb), 2) AS divergencia
      FROM fact_movies_performance f
      JOIN dim_movies m ON m.sk_movie_id = f.sk_movie_id
      WHERE f.qtd_tmdb > 0 AND f.nota_imdb IS NOT NULL
      ORDER BY divergencia DESC
      LIMIT 10

  - id: pop_03
    categoria: Popularidade e Engajamento
    pergunta: Qual a nota média IMDb por ano de lançamento?
    modo: chave+valor
    chave: ano
    valor: nota_media_imdb
    minimo: 0.65  # tudo bem o agente ignorar os anos futuros (2025-2029 têm 1-4 filmes)
    sql: |
      SELECT m.ano_lancamento AS ano, ROUND(AVG(f.nota_imdb), 2) AS nota_media_imdb,
             COUNT(*) AS qtd_filmes
      FROM fact_movies_performance f
      JOIN dim_movies m ON m.sk_movie_id = f.sk_movie_id
      WHERE f.nota_imdb IS NOT NULL
      GROUP BY m.ano_lancamento
      ORDER BY ano

  # ------------------------------------------------------- Elenco e Equipe
  - id: pes_01
    categoria: Elenco e Equipe
    pergunta: Qual ator teve mais participações em filmes lançados nos últimos 5 anos?
    modo: chave  # o número exato muda conforme o corte (data x ano), o nome não
    chave: ator
    sql: |
      SELECT p.nome_pessoa AS ator, COUNT(DISTINCT b.sk_movie_id) AS qtd_filmes
      FROM bridge_movie_person b
      JOIN dim_people p ON p.sk_person_id = b.sk_person_id
      JOIN dim_movies m ON m.sk_movie_id = b.sk_movie_id
      WHERE p.tipo_pessoa = 'Ator'
        AND m.status_filme = 'Lançado'
        AND m.data_lancamento >= date('now', '-5 years')
        AND m.data_lancamento <= date('now')
      GROUP BY p.sk_person_id
      ORDER BY qtd_filmes DESC
      LIMIT 1

  - id: pes_02
    categoria: Elenco e Equipe
    pergunta: Quais diretores têm a maior nota média, com no mínimo 5 filmes?
    modo: chave+valor
    chave: diretor
    valor: nota_media
    sql: |
      SELECT p.nome_pessoa AS diretor, COUNT(*) AS qtd_filmes,
             ROUND(AVG(f.nota_imdb), 2) AS nota_media
      FROM bridge_movie_person b
      JOIN dim_people p ON p.sk_person_id = b.sk_person_id
      JOIN fact_movies_performance f ON f.sk_movie_id = b.sk_movie_id
      WHERE p.tipo_pessoa = 'Diretor' AND f.nota_imdb IS NOT NULL
      GROUP BY p.sk_person_id
      HAVING COUNT(*) >= 5
      ORDER BY nota_media DESC
      LIMIT 10

  - id: pes_03
    categoria: Elenco e Equipe
    pergunta: Qual a dupla ator-diretor que mais trabalhou junta?
    modo: chave+valor
    chave: [ator, diretor]
    valor: qtd_filmes
    sql: |
      WITH atores AS (
          SELECT b.sk_movie_id, b.sk_person_id
          FROM bridge_movie_person b
          JOIN dim_people p ON p.sk_person_id = b.sk_person_id
          WHERE p.tipo_pessoa = 'Ator'
      ), diretores AS (
          SELECT b.sk_movie_id, b.sk_person_id
          FROM bridge_movie_person b
          JOIN dim_people p ON p.sk_person_id = b.sk_person_id
          WHERE p.tipo_pessoa = 'Diretor'
      )
      SELECT pa.nome_pessoa AS ator, pd.nome_pessoa AS diretor, COUNT(*) AS qtd_filmes
      FROM atores a
      JOIN diretores d ON d.sk_movie_id = a.sk_movie_id
      JOIN dim_people pa ON pa.sk_person_id = a.sk_person_id
      JOIN dim_people pd ON pd.sk_person_id = d.sk_person_id
      WHERE pa.nome_pessoa <> pd.nome_pessoa
      GROUP BY a.sk_person_id, d.sk_person_id
      ORDER BY qtd_filmes DESC
      LIMIT 1

  # ------------------------------------------------- Gêneros e Produtoras
  - id: gen_01
    categoria: Gêneros e Produtoras
    pergunta: Qual a quantidade de filmes por gênero?
    modo: chave+valor
    chave: genero
    valor: qtd_filmes
    sql: |
      SELECT g.nome_genero AS genero, COUNT(*) AS qtd_filmes
      FROM bridge_movie_genre bg
      JOIN dim_genres g ON g.sk_genre_id = bg.sk_genre_id
      GROUP BY g.nome_genero
      ORDER BY qtd_filmes DESC

  - id: gen_02
    categoria: Gêneros e Produtoras
    pergunta: Qual produtora tem o maior lucro total?
    modo: chave  # Marvel Studios fica em 1º em qualquer critério de filtro/moeda
    chave: produtora
    sql: |
      SELECT c.nome_produtora AS produtora, ROUND(SUM(f.lucro_brl), 2) AS lucro_total
      FROM fact_movies_performance f
      JOIN bridge_movie_company bc ON bc.sk_movie_id = f.sk_movie_id
      JOIN dim_companies c ON c.sk_company_id = bc.sk_company_id
      WHERE f.receita_brl IS NOT NULL AND f.orcamento_brl IS NOT NULL
      GROUP BY c.sk_company_id
      ORDER BY lucro_total DESC
      LIMIT 1

  - id: gen_03
    categoria: Gêneros e Produtoras
    pergunta: Qual gênero tem a maior margem de lucro média?
    modo: chave+valor
    chave: genero
    valor: margem_media_pct
    sql: |
      SELECT g.nome_genero AS genero,
             ROUND(SUM(f.receita_usd - f.orcamento_usd) * 100.0 / SUM(f.receita_usd), 2) AS margem_media_pct
      FROM fact_movies_performance f
      JOIN bridge_movie_genre bg ON bg.sk_movie_id = f.sk_movie_id
      JOIN dim_genres g ON g.sk_genre_id = bg.sk_genre_id
      WHERE f.receita_usd IS NOT NULL AND f.orcamento_usd IS NOT NULL
      GROUP BY g.nome_genero
      ORDER BY margem_media_pct DESC
      LIMIT 1
    alternativas:
      - |
        SELECT g.nome_genero AS genero,
               ROUND(SUM(f.receita_brl - f.orcamento_brl) * 100.0 / SUM(f.receita_brl), 2) AS margem_media_pct
        FROM fact_movies_performance f
        JOIN bridge_movie_genre bg ON bg.sk_movie_id = f.sk_movie_id
        JOIN dim_genres g ON g.sk_genre_id = bg.sk_genre_id
        WHERE f.receita_brl IS NOT NULL AND f.orcamento_brl IS NOT NULL
        GROUP BY g.nome_genero
        ORDER BY margem_media_pct DESC
        LIMIT 1

  # ------------------------------------------------ Avaliações dos Usuários
  - id: ava_01
    categoria: Avaliações dos Usuários
    pergunta: Quais são os filmes mais avaliados pelos usuários?
    modo: valor  # vários empates (ex: 7 filmes com 9 avaliações), a ordem dos títulos varia
    chave: titulo
    valor: qtd_avaliacoes
    sql: |
      SELECT m.titulo, m.ano_lancamento AS ano, r.qtd_avaliacoes_usuarios AS qtd_avaliacoes,
             r.nota_media_usuarios
      FROM dim_reviews r
      JOIN dim_movies m ON m.sk_movie_id = r.sk_movie_id
      ORDER BY r.qtd_avaliacoes_usuarios DESC
      LIMIT 10

  - id: ava_02
    categoria: Avaliações dos Usuários
    pergunta: Em quais filmes a nota média dos usuários mais diverge da nota IMDb?
    modo: valor  # muitos empates em 9.1
    chave: titulo
    valor: divergencia
    sql: |
      SELECT m.titulo, r.nota_media_usuarios, f.nota_imdb,
             ROUND(ABS(r.nota_media_usuarios - f.nota_imdb), 2) AS divergencia
      FROM dim_reviews r
      JOIN fact_movies_performance f ON f.sk_movie_id = r.sk_movie_id
      JOIN dim_movies m ON m.sk_movie_id = r.sk_movie_id
      WHERE f.nota_imdb IS NOT NULL
      ORDER BY divergencia DESC
      LIMIT 10

